name: Class App Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/native/**"
      - ".github/workflows/class-app-android.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/native/package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install native deps and sync Capacitor
        run: |
          npm install
          npx cap sync android

      - name: Build debug APK for parish pilot sideload
        working-directory: apps/native/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" dist/babelbeam-class.apk
          ls -la dist/babelbeam-class.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: babelbeam-class-apk
          path: apps/native/dist/babelbeam-class.apk

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="class-app-$(date -u +%Y%m%d%H%M)"
          gh release create "$TAG" dist/babelbeam-class.apk \
            --title "BabelBeam Class App $TAG" \
            --notes "Android Class App APK. Install from babelbeam.com/install. Keeps the screen awake during class when Keep screen awake is on." \
            --latest
