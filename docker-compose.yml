services:
  postgres:
    image: postgres:16-alpine
    container_name: babelbeam-postgres
    environment:
      POSTGRES_DB: babelbeam
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: babelbeam-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: babelbeam-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
