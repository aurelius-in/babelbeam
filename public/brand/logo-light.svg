<?xml version="1.0" encoding="UTF-8"?>
<!-- logo-light.svg: variant for dark backgrounds (white/ice wordmark) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="logoLightTitle logoLightDesc">
  <title id="logoLightTitle">BabelBeam (light)</title>
  <desc id="logoLightDesc">BabelBeam wordmark optimized for dark backgrounds with white wordmark and cyan beam.</desc>
  <defs>
    <linearGradient id="beamGradLight" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#59d8e5" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#9beaf4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#baf6fb" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <g id="monogram" transform="translate(40,30)">
    <rect x="0" y="0" width="120" height="240" rx="8" fill="#ffffff" opacity="0.06"/>
    <path d="M0,0 h120 v240 h-120 z" fill="#ffffff"/>
    <circle cx="80" cy="70" r="48" fill="#071b28"/>
    <circle cx="80" cy="170" r="48" fill="#071b28"/>
    <g id="beam" transform="translate(260,60)">
      <path d="M0,30 L420,0 L420,180 L0,150 z" fill="url(#beamGradLight)"/>
    </g>
  </g>

  <g id="wordmark" transform="translate(520,120)">
    <text id="word-babel" x="0" y="0" font-family="Inter, Roboto, Arial, sans-serif" font-weight="700" font-size="72" fill="#f5fbff">Babel</text>
    <text id="word-beam" x="220" y="0" font-family="Inter, Roboto, Arial, sans-serif" font-weight="700" font-size="72" fill="#59d8e5">Beam</text>
  </g>
</svg>
